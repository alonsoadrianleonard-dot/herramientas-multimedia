<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lentes futuristas · prototipo</title>
    <link rel="icon" href="data:,">  <!-- sin ícono: evita una petición que da 404 -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <style>
        :root { --navy: #0d3b66; --guinda: #8f2a5a; --bg: #f4f8fb; --text: #1a2634; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); }
        /* Escenario: misma proporción que el video, así los lentes caen justo en la cara */
        #stage { position: relative; width: 100%; max-width: 600px; margin: 0 auto; aspect-ratio: 4 / 3;
                 background: radial-gradient(circle at 50% 40%, #ffffff, #dbe7f2); overflow: hidden; border-radius: 12px; }
        #video, #canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        #video { object-fit: fill; transform: scaleX(-1); display: none; }   /* efecto espejo, como la cámara frontal */
        body.camera #canvas { transform: scaleX(-1); }
        body.camera #video { display: block; }
        #canvas { touch-action: none; }
        .bar { max-width: 600px; margin: 10px auto; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 0 12px; }
        button { font: bold 0.9rem Arial, sans-serif; padding: 9px 14px; border-radius: 8px; border: 2px solid var(--navy);
                 background: #fff; color: var(--navy); cursor: pointer; }
        button.primary { background: var(--navy); color: #fff; }
        #status { text-align: center; font-size: 0.85rem; color: #4a5a6a; min-height: 1.2em; padding: 0 12px; }
        #tapHint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: rgba(13, 59, 102, 0.8);
                   color: #fff; font-size: 0.8rem; padding: 5px 12px; border-radius: 999px; pointer-events: none; white-space: nowrap; }
    </style>
</head>
<body>
    <div id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="canvas" aria-label="Prototipo del filtro: lentes futuristas"></canvas>
        <span id="tapHint">Toca la pantalla para cambiar el color</span>
    </div>
    <div class="bar">
        <button id="btnCamera" class="primary" type="button">📷 Probar con mi cámara</button>
        <button id="btnPreview" type="button">🧑 Vista previa sin cámara</button>
        <button id="btnColor" type="button">🎨 Color: azul</button>
    </div>
    <p id="status">Vista previa: arrastra para girar la cabeza de prueba.</p>

    <!-- Modelos y texturas del filtro (generado por preparar_prototipo.py) -->
    <script src="recursos.js"></script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const R = window.RECURSOS;
        const stage = document.getElementById('stage');
        const canvas = document.getElementById('canvas');
        const video = document.getElementById('video');
        const statusEl = document.getElementById('status');
        const btnColor = document.getElementById('btnColor');
        const CM = 100;                                   // los modelos vienen en metros; la cara de MediaPipe mide en cm

        /* ---------- escena ---------- */
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        const scene = new THREE.Scene();
        scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 2.2));
        const sun = new THREE.DirectionalLight(0xffffff, 1.6);
        sun.position.set(30, 60, 80);
        scene.add(sun);
        const camera = new THREE.PerspectiveCamera(63, 4 / 3, 1, 10000);   // 63° es lo que supone MediaPipe

        // «face» recibe la posición y el giro de la cabeza; todo lo que cuelga de él la sigue
        const face = new THREE.Group();
        face.matrixAutoUpdate = false;
        scene.add(face);

        // Ocultador: una cabeza invisible que tapa las patillas cuando pasan por detrás
        const occluder = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 20),
            new THREE.MeshBasicMaterial({ colorWrite: false }));
        occluder.scale.set(7.0, 9.0, 5.6);               // más plana que la cara: no tapa el visor
        occluder.position.set(0, 1.5, -0.6);
        occluder.renderOrder = -1;
        face.add(occluder);

        // Cabeza de prueba para la vista previa (solo se ve sin cámara)
        const dummy = new THREE.Group();
        const skin = new THREE.MeshStandardMaterial({ color: 0xf1d3bd, roughness: 0.7 });
        const head = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), skin);
        head.scale.set(7.4, 9.8, 6.0); head.position.set(0, 1.0, -0.8);   // frente a 5.2 cm, como la cara real
        const nose = new THREE.Mesh(new THREE.SphereGeometry(1.1, 24, 16), skin);
        nose.scale.set(0.9, 1.6, 1.5); nose.position.set(0, 0.5, 6.0);
        dummy.add(head, nose);
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.4 });
        for (const x of [-2.9, 2.9]) {                    // ojos a la altura real (y = 2.66 cm)
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.55, 20, 14), eyeMat);
            eye.position.set(x, 2.66, 4.25); dummy.add(eye);
        }
        for (const x of [-7.6, 7.6]) {
            const ear = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), skin);
            ear.scale.set(0.8, 2.2, 1.4); ear.position.set(x, 1.4, -2.4); dummy.add(ear);
        }
        face.add(dummy);

        /* ---------- lentes ---------- */
        const COLORS = ['azul', 'guinda', 'dorado'];
        const textures = {};
        let lensMesh = null, colorIndex = 0;
        const texLoader = new THREE.TextureLoader();
        for (const c of COLORS) {
            const t = texLoader.load(R.texturas[c]);
            t.flipY = false;                               // mismo sentido que las texturas dentro del GLB
            t.colorSpace = THREE.SRGBColorSpace;
            textures[c] = t;
        }
        new GLTFLoader().load(R.modelo, (gltf) => {
            const glasses = gltf.scene;
            glasses.scale.setScalar(CM);                   // metros → centímetros
            glasses.position.set(...R.posicion.map((v) => v * CM));   // regresa el pivote a su lugar en la cabeza
            glasses.traverse((o) => {
                if (o.isMesh && o.name.startsWith('lente')) lensMesh = o;
                if (o.isMesh) o.renderOrder = 1;
            });
            face.add(glasses);
            window.filtroListo = true;
        }, undefined, (e) => { statusEl.textContent = 'No se pudo cargar el modelo: ' + e.message; });

        function nextColor() {
            colorIndex = (colorIndex + 1) % COLORS.length;
            const c = COLORS[colorIndex];
            if (lensMesh) { lensMesh.material.map = textures[c]; lensMesh.material.needsUpdate = true; }
            btnColor.textContent = '🎨 Color: ' + c;
        }
        btnColor.addEventListener('click', nextColor);

        /* ---------- vista previa (sin cámara) ---------- */
        const controls = new OrbitControls(camera, canvas);
        controls.target.set(0, 2, 0);
        controls.enablePan = false;
        controls.minDistance = 25; controls.maxDistance = 90;
        controls.autoRotate = true; controls.autoRotateSpeed = 1.2;
        function startPreview() {
            stopCamera();
            document.body.classList.remove('camera');
            dummy.visible = true; occluder.visible = false;
            face.matrix.identity();
            camera.position.set(20, 10, 38);
            controls.enabled = true;
            statusEl.textContent = 'Vista previa: arrastra para girar la cabeza de prueba y toca para cambiar el color.';
            resize(4 / 3);
        }

        // Toque en el escenario (sin arrastrar) = cambiar color, igual que en TikTok
        let down = null;
        canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
        canvas.addEventListener('pointerup', (e) => {
            if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 8) nextColor();
            down = null;
        });

        /* ---------- cámara + seguimiento facial (MediaPipe Face Landmarker) ---------- */
        let landmarker = null, stream = null, lastTime = -1;
        async function startCamera() {
            if (!window.isSecureContext) { statusEl.textContent = 'La cámara necesita HTTPS (o localhost). Abre la versión publicada.'; return; }
            statusEl.textContent = 'Cargando el seguimiento facial…';
            try {
                if (!landmarker) {
                    const { FilesetResolver, FaceLandmarker } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.0/vision_bundle.mjs');
                    const files = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.0/wasm');
                    landmarker = await FaceLandmarker.createFromOptions(files, {
                        baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate: 'GPU' },
                        runningMode: 'VIDEO', numFaces: 1, outputFacialTransformationMatrixes: true,
                    });
                }
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
                video.srcObject = stream;
                await video.play();
                document.body.classList.add('camera');
                dummy.visible = false; occluder.visible = true;
                controls.enabled = false;
                camera.position.set(0, 0, 0); camera.rotation.set(0, 0, 0);
                resize(video.videoWidth / video.videoHeight);
                statusEl.textContent = 'Cámara activa: mira a la cámara y toca la pantalla para cambiar el color.';
            } catch (e) {
                statusEl.textContent = 'No se pudo usar la cámara: ' + e.message;
                startPreview();
            }
        }
        function stopCamera() {
            if (stream) stream.getTracks().forEach((t) => t.stop());
            stream = null;
        }
        document.getElementById('btnCamera').addEventListener('click', startCamera);
        document.getElementById('btnPreview').addEventListener('click', startPreview);

        function resize(aspect) {
            stage.style.aspectRatio = String(aspect);
            const w = stage.clientWidth, h = stage.clientHeight;
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        new ResizeObserver(() => resize(camera.aspect)).observe(stage);

        /* ---------- ciclo ---------- */
        renderer.setAnimationLoop(() => {
            if (stream && landmarker && video.readyState >= 2 && video.currentTime !== lastTime) {
                lastTime = video.currentTime;
                const res = landmarker.detectForVideo(video, performance.now());
                const m = res.facialTransformationMatrixes && res.facialTransformationMatrixes[0];
                face.visible = !!m;
                if (m) face.matrix.fromArray(m.data);      // posición y giro de la cabeza, en cm
                face.matrixWorldNeedsUpdate = true;
            } else if (!stream) {
                face.visible = true;
                controls.update();
            }
            renderer.render(scene, camera);
        });
        startPreview();
        // Para pruebas automáticas: fija la vista de la cámara de prueba
        window.__setView = (pos) => { controls.autoRotate = false; camera.position.set(...pos); controls.update(); };
    </script>
</body>
</html>
